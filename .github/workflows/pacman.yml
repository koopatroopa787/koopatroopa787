name: Generate Pac-Man animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: koopatroopa787
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%237aa2f7
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=%237aa2f7

      - name: push pac-man.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
