name: Generate Pac-Man animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: koopatroopa787
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ffffff&color_dots=%23161b22,%23383838,%235a5a5a,%23888888,%23ffffff
            dist/github-contribution-grid-snake-light.svg?color_snake=%23000000&color_dots=%23ebedf0,%23c4c4c4,%23949494,%23636363,%23000000

      - name: push pac-man.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
